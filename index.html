<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Insta</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      width: 90%;
      max-width: 400px;
      background: #1b1b1b;
      padding: 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    h2 {
      margin-bottom: 20px;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    input {
      background: #2a2a2a;
      color: #fff;
    }

    button {
      background: #00d26a;
      font-weight: bold;
      cursor: pointer;
    }

    .secondary {
      background: #444;
      color: white;
    }

    .hidden {
      display: none;
    }

    #msg {
      margin-top: 10px;
      font-size: 14px;
      color: #ccc;
    }
  </style>
</head>

<body>

<div class="box">

  <!-- LOGIN -->
  <div id="loginBox">
    <h2>Mini Insta</h2>

    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Contraseña">

    <button onclick="register()">Registrarse</button>
    <button class="secondary" onclick="login()">Iniciar sesión</button>

    <p id="msg"></p>
  </div>

  <!-- APP -->
  <div id="appBox" class="hidden">
    <h2>Bienvenido 🔥</h2>
    <p>Ya estás dentro.</p>
    <button onclick="logout()">Cerrar sesión</button>
  </div>

</div>

<script type="module" src="script.js"></script>

</body>
</html>
